<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      width: 300px;
      margin: 0;
      padding: 16px;
      background: #0f172a;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      border-bottom: 1px solid #334155;
      padding-bottom: 12px;
      margin-bottom: 12px;
    }
    .logo-badge {
      background: linear-gradient(135deg, #0284c7 0%, #0d9488 100%);
      width: 32px;
      height: 32px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 900;
      font-size: 16px;
    }
    .title {
      font-size: 14px;
      font-weight: 800;
    }
    .subtitle {
      font-size: 11px;
      color: #94a3b8;
    }
    .status-card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 12px;
      padding: 12px;
      margin-bottom: 14px;
    }
    .status-row {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      margin-bottom: 6px;
    }
    .badge {
      background: rgba(52, 211, 153, 0.15);
      color: #34d399;
      padding: 2px 8px;
      border-radius: 9999px;
      font-size: 10px;
      font-weight: 700;
      border: 1px solid rgba(52, 211, 153, 0.3);
    }
    .btn {
      width: 100%;
      background: linear-gradient(135deg, #0284c7 0%, #0d9488 100%);
      color: white;
      border: none;
      padding: 10px;
      border-radius: 10px;
      font-weight: 700;
      font-size: 12px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      box-shadow: 0 4px 12px rgba(2, 132, 199, 0.3);
    }
    .btn:hover {
      opacity: 0.95;
    }
    .link {
      display: block;
      text-align: center;
      color: #38bdf8;
      font-size: 11px;
      margin-top: 10px;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo-badge">⚡</div>
    <div>
      <div class="title">HireQ Auto-Fill Assistant</div>
      <div class="subtitle">Multi-ATS Job Copilot</div>
    </div>
  </div>

  <div class="status-card">
    <div class="status-row">
      <span style="color: #94a3b8;">Application Vault:</span>
      <span class="badge" id="vault-status">16/16 Ready</span>
    </div>
    <div class="status-row">
      <span style="color: #94a3b8;">Candidate:</span>
      <span style="font-weight: 600;" id="user-name">Ahmed Essam</span>
    </div>
    <div class="status-row" style="margin-bottom: 0;">
      <span style="color: #94a3b8;">ATS Detection:</span>
      <span style="color: #38bdf8; font-weight: 600;" id="page-type">Active Page</span>
    </div>
  </div>

  <button class="btn" id="trigger-fill">
    <span>⚡</span>
    <span>Auto-Fill Current Page</span>
  </button>

  <a class="link" href="http://localhost:3005/profile" target="_blank">
    Open HireQ Profile & Vault →
  </a>

  <script src="popup.js"></script>
</body>
</html>
